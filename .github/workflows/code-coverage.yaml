name: Code Coverage

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - '**'

jobs:
  coverage:
    name: Run Coverage and Comment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with full coverage text output
        run: |
          npm run test -- --coverage --coverageReporters=text > coverage.txt

      - name: Post full coverage table to PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: coverage.txt
